name: Release

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, arch: x64, runner: windows-2022, target: x86_64-pc-windows-msvc }
          - { platform: windows, arch: arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { platform: macos, arch: x64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { platform: macos, arch: arm64, runner: macos-15, target: aarch64-apple-darwin }
          - { platform: linux, arch: x64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { platform: linux, arch: arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: ${{ matrix.platform == 'windows' && '-C target-feature=+crt-static' || '' }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      QUARRY_PYTHON: ${{ matrix.platform == 'windows' && 'python' || 'python3' }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version
        run: '"$QUARRY_PYTHON" packaging/release.py version --github-env'

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install "1.98.0-${{ matrix.target }}" --profile minimal --no-self-update
          rustup default "1.98.0-${{ matrix.target }}"

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config dpkg-dev \
            libssl-dev libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev mesa-vulkan-drivers

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target/dist"
          cache-on-failure: true

      - name: Run unit and SQLite tests
        run: cargo test --workspace --release --locked --target-dir target/dist

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -Architecture '${{ matrix.arch }}'

      - name: Build macOS and Linux applications
        if: matrix.platform != 'windows'
        run: cargo build --release --locked -p quarry-app -p quarry-ai --target-dir target/dist

      - name: Verify native binaries and MCP startup
        run: '"$QUARRY_PYTHON" packaging/verify.py --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"'

      - name: Package native applications
        run: '"$QUARRY_PYTHON" packaging/release.py package --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"'

      - name: Upload verified downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarry-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/downloads/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish all desktop builds
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all six platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quarry-*
          merge-multiple: true
          path: target/downloads

      - name: Validate complete release and generate checksums
        run: python3 packaging/release.py checksums

      - name: Publish complete GitHub release
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > target/existing-release.json; then
            python3 -c 'import json; assert json.load(open("target/existing-release.json"))["isDraft"], "This release is already public; existing downloads will not be replaced"'
            gh release upload "$RELEASE_TAG" target/downloads/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file packaging/release-notes.md
          else
            gh release create "$RELEASE_TAG" target/downloads/* --verify-tag --draft \
              --title "Quarry $RELEASE_TAG" --notes-file packaging/release-notes.md --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
