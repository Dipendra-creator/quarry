[workspace]
resolver = "2"
members = ["crates/quarry-core", "crates/quarry-ai", "crates/quarry-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
quarry-core = { path = "crates/quarry-core" }
quarry-ai = { path = "crates/quarry-ai" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util"] }
