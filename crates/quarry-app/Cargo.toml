[package]
name = "quarry-app"
description = "Quarry desktop app (GPUI)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quarry"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
quarry-core.workspace = true
quarry-ai.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
lsp-types = { version = "0.97", features = ["proposed"] }
gpui-kit = { version = "0.8.0", features = ["tree-sitter-sql"] }
