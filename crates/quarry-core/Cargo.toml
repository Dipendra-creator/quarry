[package]
name = "quarry-core"
description = "UI-free database engine for Quarry: drivers, schema introspection, staged edits and connection storage."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "native-tls-tls"] }
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "tokio-native-tls-comp", "acl"] }
mongodb = "3"

# SQL Server's self-generated TLS certificates fail Apple's TLS stack even when
# trusted, so macOS uses rustls (which skips verification when asked); the
# other platforms keep their native TLS like the PostgreSQL and MySQL drivers.
[target.'cfg(target_os = "macos")'.dependencies.tiberius]
version = "0.12"
default-features = false
features = ["tds73", "chrono", "rustls"]
[target.'cfg(not(target_os = "macos"))'.dependencies.tiberius]
version = "0.12"
default-features = false
features = ["tds73", "chrono", "native-tls"]

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
