<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Quarry: the open-source, AI-native database client. A Quarry window shows the orders table next to the AI assistant, which answers a question with a result table and its SQL.">
  <title>Quarry: the open-source, AI-native database client</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#101A33"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.16" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#2465DA" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2465DA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.92" cy="1" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8DFB"/>
      <stop offset="1" stop-color="#1D4FC4"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="card"><rect width="1280" height="440" rx="28"/></clipPath>
    <clipPath id="win"><rect width="548" height="336" rx="12"/></clipPath>
    <style>
      .ui { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
      .s1 { animation: s1 9s infinite both; }
      .s2 { animation: s2 9s infinite both; }
      .s3 { animation: s3 9s infinite both; }
      .s4 { animation: s4 9s infinite both; }
      .s5 { animation: s5 9s infinite both; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      .spark { animation: pulse 2.4s ease-in-out infinite; }
      /* Starts on the finished chat, so a still frame shows it; then fades and replays. */
      @keyframes s1 { 0%, 55% { opacity: 1 } 58%, 62% { opacity: 0 } 66%, 100% { opacity: 1 } }
      @keyframes s2 { 0%, 55% { opacity: 1 } 58%, 70% { opacity: 0 } 74%, 100% { opacity: 1 } }
      @keyframes s3 { 0%, 55% { opacity: 1 } 58%, 78% { opacity: 0 } 82%, 100% { opacity: 1 } }
      @keyframes s4 { 0%, 55% { opacity: 1 } 58%, 86% { opacity: 0 } 90%, 100% { opacity: 1 } }
      @keyframes s5 { 0%, 55% { opacity: 1 } 58%, 93% { opacity: 0 } 97%, 100% { opacity: 1 } }
      @keyframes blink { 0% { opacity: 1 } 50% { opacity: 0 } }
      @keyframes pulse { 0%, 100% { opacity: 0.55 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .s1, .s2, .s3, .s4, .s5, .caret, .spark { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#dots)"/>
    <rect width="1280" height="440" fill="url(#glowBlue)"/>
    <rect width="1280" height="440" fill="url(#glowViolet)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Name and pitch -->
  <g transform="translate(72 90) scale(0.09375)">
    <circle cx="512" cy="512" r="496" fill="url(#disc)"/>
    <g fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round">
      <ellipse cx="512" cy="330" rx="224" ry="54"/>
      <path d="M288 515a224 54 0 0 0 448 0M288 700a224 54 0 0 0 448 0M288 330v370M736 330v370"/>
    </g>
  </g>
  <text class="ui" x="186" y="160" font-size="66" font-weight="700" fill="#F5F7FF" letter-spacing="-1">Quarry</text>
  <text class="ui" x="72" y="240" font-size="36" font-weight="600" fill="#E8EDFA" letter-spacing="-0.5">The open-source, <tspan fill="url(#ai)">AI-native</tspan></text>
  <text class="ui" x="72" y="284" font-size="36" font-weight="600" fill="#E8EDFA" letter-spacing="-0.5">database client.</text>
  <text class="ui" x="72" y="326" font-size="18" fill="#A9B4CC">Rust + GPUI. No accounts, no license keys, no paywalls.</text>

  <g class="ui" font-size="15" font-weight="600" fill="#DCE3F5">
    <rect x="72" y="352" width="121" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="91" cy="369" r="5" fill="#336791"/>
    <text x="103" y="374">PostgreSQL</text>
    <rect x="203" y="352" width="86" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="222" cy="369" r="5" fill="#00A0C6"/>
    <text x="234" y="374">MySQL</text>
    <rect x="299" y="352" width="98" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="318" cy="369" r="5" fill="#B08A68"/>
    <text x="330" y="374">MariaDB</text>
    <rect x="407" y="352" width="90" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="426" cy="369" r="5" fill="#0F80CC"/>
    <text x="438" y="374">SQLite</text>
    <rect x="507" y="352" width="72" height="34" rx="17" fill="url(#ai)" fill-opacity="0.22" stroke="#A78BFA" stroke-opacity="0.5"/>
    <text x="526" y="374" fill="#E9DDFF">MCP</text>
  </g>

  <!-- The app, in miniature -->
  <g transform="translate(684 52)" class="ui">
    <rect width="548" height="336" rx="12" fill="#1B1B1D" filter="url(#shadow)"/>
    <g clip-path="url(#win)">
      <rect width="548" height="336" fill="#1B1B1D"/>
      <!-- title bar -->
      <rect width="548" height="38" fill="#232326"/>
      <rect y="37.5" width="548" height="1" fill="#111113"/>
      <g fill="none" stroke="#3A3A40">
        <rect x="10" y="8" width="58" height="22" rx="11"/>
        <rect x="76" y="8" width="58" height="22" rx="11"/>
        <rect x="442" y="8" width="96" height="22" rx="11"/>
      </g>
      <g fill="#8E939C">
        <rect x="20" y="15" width="8" height="8" rx="2"/><rect x="35" y="15" width="8" height="8" rx="2"/><rect x="50" y="15" width="8" height="8" rx="2"/>
        <rect x="86" y="15" width="8" height="8" rx="2"/><rect x="101" y="15" width="8" height="8" rx="2"/><rect x="116" y="15" width="8" height="8" rx="2"/>
        <rect x="453" y="15" width="8" height="8" rx="2"/><rect x="468" y="15" width="8" height="8" rx="2"/>
      </g>
      <rect x="489" y="11" width="16" height="16" rx="8" fill="#3B82F7" fill-opacity="0.25"/>
      <path class="spark" d="M497 13.5l1.6 4 4 1.5-4 1.5-1.6 4-1.6-4-4-1.5 4-1.5z" fill="#93C5FD"/>
      <rect x="182" y="8" width="184" height="22" rx="6" fill="#0F5132"/>
      <text class="mono" x="274" y="23" font-size="10.5" fill="#DAEBC2" text-anchor="middle">MySQL 8.4 : shop</text>

      <!-- sidebar -->
      <rect y="38" width="118" height="298" fill="#222225"/>
      <rect x="117.5" y="38" width="1" height="298" fill="#2E2E33"/>
      <rect x="8" y="47" width="102" height="16" rx="4" fill="#2C2C30"/>
      <text x="16" y="58.5" font-size="8.5" fill="#7B7F88">Search for item…</text>
      <text x="10" y="80" font-size="8" font-weight="700" fill="#8A8F99" letter-spacing="0.6">TABLES (7)</text>
      <rect x="4" y="154" width="110" height="16" rx="3" fill="#0B4A78"/>
      <g font-size="10" fill="#D5D5D5">
        <rect x="12" y="89" width="9" height="7" rx="1.5" fill="#3B82F7"/><text x="26" y="96">categories</text>
        <rect x="12" y="106" width="9" height="7" rx="1.5" fill="#3B82F7"/><text x="26" y="113">customers</text>
        <rect x="12" y="123" width="9" height="7" rx="1.5" fill="#3B82F7"/><text x="26" y="130">employees</text>
        <rect x="12" y="140" width="9" height="7" rx="1.5" fill="#3B82F7"/><text x="26" y="147">order_items</text>
        <rect x="12" y="157" width="9" height="7" rx="1.5" fill="#93C5FD"/><text x="26" y="164" fill="#FFFFFF">orders</text>
        <rect x="12" y="174" width="9" height="7" rx="1.5" fill="#3B82F7"/><text x="26" y="181">products</text>
        <rect x="12" y="191" width="9" height="7" rx="1.5" fill="#3B82F7"/><text x="26" y="198">reviews</text>
      </g>
      <text x="10" y="222" font-size="8" font-weight="700" fill="#8A8F99" letter-spacing="0.6">VIEWS (2)</text>
      <g font-size="10" fill="#D5D5D5">
        <circle cx="16.5" cy="234" r="3.5" fill="none" stroke="#3B82F7" stroke-width="1.6"/><text x="26" y="237.5">customer_order_s…</text>
        <circle cx="16.5" cy="251" r="3.5" fill="none" stroke="#3B82F7" stroke-width="1.6"/><text x="26" y="254.5">product_ratings</text>
      </g>
      <text x="10" y="278" font-size="8" font-weight="700" fill="#8A8F99" letter-spacing="0.6">FUNCTIONS (1)</text>
      <text x="26" y="295" font-size="10" fill="#D5D5D5">order_count</text>
      <text x="12" y="295" font-size="9" font-weight="700" fill="#3B82F7" font-style="italic">f</text>

      <!-- data grid -->
      <rect x="118" y="38" width="220" height="22" fill="#2A2A2D"/>
      <rect x="124" y="42" width="66" height="15" rx="7.5" fill="#1B1B1D"/>
      <text x="157" y="53" font-size="9" fill="#E6E6E6" text-anchor="middle">orders</text>
      <rect x="118" y="60" width="220" height="18" fill="#262629"/>
      <g font-size="9" font-weight="700" fill="#E6E6E6">
        <text x="126" y="72.5">id</text><text x="156" y="72.5">customer</text><text x="226" y="72.5">status</text><text x="332" y="72.5" text-anchor="end">total</text>
      </g>
      <g fill="#222225">
        <rect x="118" y="95" width="220" height="17"/><rect x="118" y="129" width="220" height="17"/><rect x="118" y="163" width="220" height="17"/>
        <rect x="118" y="197" width="220" height="17"/><rect x="118" y="231" width="220" height="17"/><rect x="118" y="265" width="220" height="17"/>
        <rect x="118" y="299" width="220" height="17"/>
      </g>
      <g class="mono" font-size="9" fill="#CFCFCF">
        <text x="126" y="90">1</text><text x="156" y="90">578</text><text x="226" y="90">delivered</text><text x="332" y="90" text-anchor="end">2,140.20</text>
        <text x="126" y="107">2</text><text x="156" y="107">186</text><text x="226" y="107">paid</text><text x="332" y="107" text-anchor="end">318.75</text>
        <text x="126" y="124">3</text><text x="156" y="124">938</text><text x="226" y="124">shipped</text><text x="332" y="124" text-anchor="end">1,092.40</text>
        <text x="126" y="141">4</text><text x="156" y="141">445</text><text x="226" y="141">pending</text><text x="332" y="141" text-anchor="end">87.10</text>
        <text x="126" y="158">5</text><text x="156" y="158">454</text><text x="226" y="158">delivered</text><text x="332" y="158" text-anchor="end">764.00</text>
        <text x="126" y="175">6</text><text x="156" y="175">27</text><text x="226" y="175" fill="#EB5545">cancelled</text><text x="332" y="175" text-anchor="end">55.90</text>
        <text x="126" y="192">7</text><text x="156" y="192">612</text><text x="226" y="192">paid</text><text x="332" y="192" text-anchor="end">1,415.65</text>
        <text x="126" y="209">8</text><text x="156" y="209">93</text><text x="226" y="209">shipped</text><text x="332" y="209" text-anchor="end">246.30</text>
        <text x="126" y="226">9</text><text x="156" y="226">301</text><text x="226" y="226">delivered</text><text x="332" y="226" text-anchor="end">980.00</text>
        <text x="126" y="243">10</text><text x="156" y="243">578</text><text x="226" y="243">paid</text><text x="332" y="243" text-anchor="end">3,310.85</text>
        <text x="126" y="260">11</text><text x="156" y="260">720</text><text x="226" y="260">pending</text><text x="332" y="260" text-anchor="end">129.99</text>
        <text x="126" y="277">12</text><text x="156" y="277">186</text><text x="226" y="277">delivered</text><text x="332" y="277" text-anchor="end">2,007.50</text>
        <text x="126" y="294">13</text><text x="156" y="294">15</text><text x="226" y="294">shipped</text><text x="332" y="294" text-anchor="end">412.00</text>
        <text x="126" y="311">14</text><text x="156" y="311">852</text><text x="226" y="311">paid</text><text x="332" y="311" text-anchor="end">675.25</text>
        <text x="126" y="328">15</text><text x="156" y="328">445</text><text x="226" y="328">delivered</text><text x="332" y="328" text-anchor="end">1,188.40</text>
      </g>

      <!-- AI assistant pane -->
      <rect x="338" y="38" width="210" height="298" fill="#1E1E21"/>
      <rect x="338" y="38" width="1" height="298" fill="#2E2E33"/>
      <path d="M350 45.5l1.5 3.8 3.8 1.5-3.8 1.5-1.5 3.8-1.5-3.8-3.8-1.5 3.8-1.5z" fill="#60A5FA"/>
      <text x="361" y="54" font-size="10.5" font-weight="600" fill="#F2F2F2">AI Assistant</text>
      <text x="538" y="54" font-size="9" fill="#7B7F88" text-anchor="end">Claude Code</text>
      <rect x="338" y="62" width="210" height="1" fill="#2E2E33"/>

      <g class="s1">
        <rect x="398" y="70" width="142" height="22" rx="8" fill="#243140"/>
        <text x="469" y="84.5" font-size="9" fill="#E8EDF7" text-anchor="middle">Top 5 customers by revenue?</text>
      </g>
      <g class="s2">
        <rect x="346" y="100" width="194" height="18" rx="5" fill="#252529" stroke="#34343A"/>
        <text x="353" y="112.5" font-size="9" fill="#7B7F88">›</text>
        <text class="mono" x="362" y="112.5" font-size="8.5" fill="#E6E6E6">schema_overview</text>
        <circle cx="530" cy="109" r="4.5" fill="none" stroke="#6BD45F" stroke-width="1.4"/>
        <path d="M528 109l1.5 1.5 2.7-2.8" fill="none" stroke="#6BD45F" stroke-width="1.3"/>
      </g>
      <g class="s3">
        <rect x="346" y="122" width="194" height="18" rx="5" fill="#252529" stroke="#34343A"/>
        <text x="353" y="134.5" font-size="9" fill="#7B7F88">›</text>
        <text class="mono" x="362" y="134.5" font-size="8.5" fill="#E6E6E6">run_sql</text>
        <text class="mono" x="400" y="134.5" font-size="8" fill="#7B7F88">WITH totals AS (…</text>
        <circle cx="530" cy="131" r="4.5" fill="none" stroke="#6BD45F" stroke-width="1.4"/>
        <path d="M528 131l1.5 1.5 2.7-2.8" fill="none" stroke="#6BD45F" stroke-width="1.3"/>
      </g>
      <g class="s4">
        <text x="346" y="157" font-size="9" fill="#D5D5D5">Ranked by total spent, cancelled orders left out:</text>
        <rect x="346" y="163" width="194" height="52" rx="4" fill="none" stroke="#34343A"/>
        <rect x="346" y="163" width="194" height="13" rx="4" fill="#262629"/>
        <g font-size="8" fill="#E6E6E6">
          <text x="352" y="172.5" font-weight="700">Customer</text><text x="470" y="172.5" font-weight="700">Orders</text><text x="534" y="172.5" font-weight="700" text-anchor="end">Spent</text>
          <text x="352" y="186">Liam Garcia</text><text x="470" y="186">3</text><text class="mono" x="534" y="186" text-anchor="end">17,980.74</text>
          <text x="352" y="198">Chloe Kim</text><text x="470" y="198">5</text><text class="mono" x="534" y="198" text-anchor="end">17,371.85</text>
          <text x="352" y="210">Chloe Garcia</text><text x="470" y="210">5</text><text class="mono" x="534" y="210" text-anchor="end">16,802.21</text>
        </g>
      </g>
      <g class="s5">
        <rect x="346" y="222" width="194" height="70" rx="5" fill="#141416" stroke="#2E2E33"/>
        <g fill="#7B7F88"><rect x="508" y="227" width="6" height="6" rx="1.5"/><rect x="518" y="227" width="6" height="6" rx="1.5"/><rect x="528" y="227" width="6" height="6" rx="1.5"/></g>
        <g class="mono" font-size="8.5" fill="#D5D5D5">
          <text x="353" y="245"><tspan fill="#7AA2F7">SELECT</tspan> c.first_name, <tspan fill="#E5C07B">SUM</tspan>(o.total)</text>
          <text x="353" y="256"><tspan fill="#7AA2F7">FROM</tspan> orders o <tspan fill="#7AA2F7">JOIN</tspan> customers c</text>
          <text x="363" y="267"><tspan fill="#7AA2F7">ON</tspan> c.id = o.customer_id</text>
          <text x="353" y="278"><tspan fill="#7AA2F7">GROUP BY</tspan> c.id <tspan fill="#7AA2F7">ORDER BY</tspan> <tspan fill="#F2A33C">2</tspan> <tspan fill="#7AA2F7">DESC</tspan></text>
          <text x="353" y="289"><tspan fill="#7AA2F7">LIMIT</tspan> <tspan fill="#F2A33C">5</tspan>;</text>
        </g>
      </g>

      <rect x="346" y="302" width="194" height="26" rx="6" fill="#18181B" stroke="#3B82F7" stroke-opacity="0.8"/>
      <rect class="caret" x="353" y="309" width="1.2" height="12" fill="#93C5FD"/>
      <text x="358" y="318.5" font-size="8.5" fill="#6B7079">Ask about your data…</text>
      <circle cx="528" cy="315" r="8" fill="#3B82F7"/>
      <path d="M528 319v-7.5M524.8 314.6l3.2-3.2 3.2 3.2" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
